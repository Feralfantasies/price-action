# price-action example configuration.
#
# Copy to `price-action.toml` (or point PRICE_ACTION_CONFIG at any path).
# Every key is optional — unset keys fall back to compiled defaults, and any
# PRICE_ACTION_* environment variable overrides both.

# Instrument to trade.
symbol = "AAPL"

# Shares/contracts per trade (>= 1).
quantity = 1

# "paper" (simulated, default) or "live" (requires broker_url; live EXECUTION
# is not implemented — the binary refuses it). Note this key is about order
# placement, not market data: the `live` subcommand streams real data while
# still executing on the in-memory paper broker.
mode = "paper"

# Bar interval in seconds (>= 1).
bar_interval_secs = 60

# Number of recent bars retained in the rolling window (>= 1).
series_capacity = 500

# Consecutive higher/lower closes before the example strategy signals (>= 1).
consecutive_closes_threshold = 3

# Paper starting balance for replay reporting — free funds before the first
# trade, e.g. 10000 (must be a finite number greater than 0). Replay-only.
starting_balance = 10000

# Paper trade fee in basis points per side of each replay report trade
# (>= 0; 5 = 0.05% of each leg's notional; 0 disables fees).
trade_fee_bps = 5

# Maximum leverage a paper position may carry (>= 1, <= 100; 1 = unleveraged).
# Above 1 the position controls quantity*leverage units of notional: fees and
# P/L price that leveraged notional, while the capital committed stays the
# required margin (quantity*close). A position whose required margin marked
# equity can no longer support is force-closed ("liquidated") at that bar's
# close. Leveraged runs print extra report columns and totals rows; 1x output
# is unchanged. See docs/paper-trading-accounting.md.
max_leverage = 1

# Broker/venue API base URL — required in live mode.
# broker_url = "https://broker.example/api"

# Broker API key. Prefer the PRICE_ACTION_BROKER_API_KEY environment variable
# or a mounted secret over putting credentials in this file.
# broker_api_key = "..."

# ---------------------------------------------------------------------------
# Live market-data session (`price-action live`) — paper execution only.
# These keys are read on every load path but only used by `live`.
# ---------------------------------------------------------------------------

# Which market data `live` streams from:
#   "massive" — Massive.com stocks WebSocket (the default; authenticated,
#               needs massive_api_key below)
#   "kraken"  — Kraken Spot WebSocket v2 `ohlc` channel: PUBLIC, no key exists
#               for it and none is read. Minute channel only; bars are Kraken's
#               candles at bar_interval_secs (1m/5m/15m/30m/1h/1d).
live_feed_source = "massive"

# Massive.com socket host: a BARE hostname (no scheme, path or whitespace).
# `live` builds wss://<host>/stocks from it.
#   socket.massive.com   real-time
#   delayed.massive.com  15-minute delayed
live_feed_host = "socket.massive.com"

# Which native feed channel to consume:
#   "minute" — per-minute OHLCV windows (AM.<SYMBOL>), one bar per traded
#              minute; the window in flight is held until the next one starts
#              so the bar carries its FINAL numbers (bars lag ~1 minute).
#   "ticks"  — tick trades (T.<SYMBOL>), aggregated locally into per-second bars.
live_feed_channel = "minute"

# Massive.com API key. SECRET — strongly prefer the
# PRICE_ACTION_MASSIVE_API_KEY environment variable or a mounted secret over
# committing it here. Required by `live` only when live_feed_source = "massive";
# never needed for replay, and never read for the public Kraken source.
# massive_api_key = "..."

# Directory where `live` writes each session's bars as a replay-compatible CSV
# (live-<SYMBOL>-<UTC stamp>.csv), created if absent. Re-replay that file
# offline to reproduce the session exactly.
live_csv_dir = "./sessions"

# ---------------------------------------------------------------------------
# Telegram delivery of the live session's daily summaries — optional.
# Both keys must be set together, or neither: with neither, summaries are
# printed to the console only. The bot token is a SECRET — prefer
# PRICE_ACTION_TELEGRAM_BOT_TOKEN.
# ---------------------------------------------------------------------------

# Bot token from @BotFather.
# telegram_bot_token = "..."

# Destination chat id (may be negative for a group or channel).
# telegram_chat_id = "-1001234567890"
